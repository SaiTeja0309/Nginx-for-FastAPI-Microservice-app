{% extends "base.html" %}
{% block content %}
<h2>Sign Up</h2>
<form method="post">
    <input name="first_name" placeholder="First Name" class="form-control mb-2" required>
    <input name="last_name" placeholder="Last Name" class="form-control mb-2" required>
    <input name="username" placeholder="Username" class="form-control mb-2" required>
    <input name="password" type="password" placeholder="Password" class="form-control mb-2" required>
    <button class="btn btn-primary">Sign Up</button>
</form>
{% if error %}<div class="text-danger mt-2">{{ error }}</div>{% endif %}
{% endblock %}
